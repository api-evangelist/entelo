description: >-
  Entelo is an AI-powered talent-sourcing and recruiting-automation platform for finding, engaging,
  and hiring candidates using predictive analytics, diversity-aware search, and candidate-engagement
  tooling. Entelo was acquired and is now delivered as "Entelo Recruit" within Rival (rival-hr.com),
